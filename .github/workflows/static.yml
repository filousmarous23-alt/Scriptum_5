name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build / Prepare artifact
        run: |
          # Just ensure all files are collected from repo root
          mkdir -p artifact
          cp -r --exclude=artifact ./* artifact/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './artifact'   # All HTML, CSS, images preserved with folder structure

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
